name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Lint (swift format)
        run: swift format lint --strict --recursive Sources Tests Package.swift

  lint:
    name: Lint shell & markdown (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: shellcheck
        run: mise exec -- shellcheck scripts/*.sh
      - name: shfmt
        run: mise exec -- shfmt -d scripts/
      - name: oxfmt (markdown format check)
        run: |
          mise exec -- oxfmt
          git diff --exit-code
